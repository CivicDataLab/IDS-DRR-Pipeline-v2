# config/states/odisha.yaml
# State-specific configuration for Odisha

state_id: odisha
state_code: OD
enabled: false

admin_boundaries:
  source: bharatmaps
  level: revenue_circle

data_sources:
  satellite:
    gcn250: true
    bhuvan: true
    bhuvan_config:
      # Bounding box: [min_lon, min_lat, max_lon, max_lat]
      bbox: [81.3370, 17.7800, 87.4860, 22.5690]
      wms_code: "od"
      layer_prefix: "flood"
      admin_boundary_shapefile: "data/shapefiles/odisha_revenue_circles.shp"

  procurement:
    portal_url: https://tendersodisha.gov.in
    scraper_class: OdishaTenderScraper

  # Odisha has OSDMA portal
  custom:
    osdma_portal:
      enabled: true
      url: https://www.osdma.org

  demographics:
    census_year: 2011
    worldpop: true

update_frequencies:
  weather: daily
  procurement: monthly
  demographics: static

output:
  risk_score_table: odisha_flood_risk_scores
  partition_key: revenue_circle_id
