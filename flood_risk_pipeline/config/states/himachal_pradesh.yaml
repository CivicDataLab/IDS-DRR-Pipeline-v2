# config/states/himachal_pradesh.yaml
# State-specific configuration for Himachal Pradesh

state_id: himachal_pradesh
state_code: HP

admin_boundaries:
  source: bharatmaps
  level: revenue_circle

data_sources:
  satellite:
    gcn250: true
    bhuvan: true
    bhuvan_config:
      # Bounding box: [min_lon, min_lat, max_lon, max_lat]
      bbox: [75.5886, 30.3824, 79.0462, 33.2590]
      wms_code: "hp"
      layer_prefix: "flood"
      admin_boundary_shapefile: "data/shapefiles/hp_revenue_circles.shp"

  procurement:
    portal_url: https://hptenders.gov.in
    scraper_class: HPTenderScraper

  demographics:
    census_year: 2011
    worldpop: true

update_frequencies:
  weather: daily
  procurement: monthly
  demographics: static

output:
  risk_score_table: hp_flood_risk_scores
  partition_key: revenue_circle_id
